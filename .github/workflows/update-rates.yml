name: Sync ATO Rates

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Refresh ATO data
        env:
          ATO_RATES_SOURCE: https://gstcalc.github.io/data/ato-rates.json
        run: npm run update:rates

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: sync ATO rate tables'
          branch: data/sync
          commit_user_name: gstcalc-bot
          commit_user_email: bot@gstcalc.dev
          file_pattern: data/ato-rates.json public/data/ato-rates.json
